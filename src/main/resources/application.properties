# Secrets are NOT stored in this file. They are read from a local ".env" file (see .env.example)
# or from real environment variables (e.g. on Render). Required values without a default
# (DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET) stop the startup with a clear message when missing.
spring.config.import=optional:file:./.env[.properties]

# ============================================
# APPLICATION CONFIGURATION
# ============================================
spring.application.name=Mess Management System
server.port=${PORT:8080}

# ============================================
# DATABASE - SUPABASE
# ============================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=10000

# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# SQL logging is off by default (it is noisy and slows the app). Set SHOW_SQL=true while debugging.
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.id.new_generator_mappings=true

# ============================================
# FILE UPLOAD
# ============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.web.resources.static-locations=classpath:/static/,file:uploads/
# Limit for stock images and expense receipts, in MB (keep it at or below the multipart limit above)
app.upload.max-size-mb=10

# ============================================
# STORAGE
# STORAGE_TYPE=local     -> files in the "uploads" folder (development only, lost on Render redeploys)
# STORAGE_TYPE=supabase  -> files in a Supabase Storage bucket (use this in production)
# ============================================
storage.type=${STORAGE_TYPE:local}
storage.local.upload-dir=uploads/stock-images
storage.local.base-url=/uploads/stock-images/

# Supabase Storage (only used when STORAGE_TYPE=supabase). The key stays on the backend.
supabase.url=${SUPABASE_URL:}
supabase.storage.api-key=${SUPABASE_STORAGE_API_KEY:}
supabase.storage.bucket-name=${SUPABASE_STORAGE_BUCKET_NAME:}
# true only if the bucket is marked "Public" in Supabase; otherwise signed URLs are used
supabase.storage.public=${SUPABASE_STORAGE_PUBLIC:false}
supabase.storage.signed-url-ttl-seconds=3600

# ============================================
# EMAIL
# EMAIL_PROVIDER = smtp | resend | brevo | console
#   smtp    -> Gmail/other SMTP below (local development; BLOCKED on Render Free)
#   resend  -> Resend HTTPS API   (needs EMAIL_API_KEY, EMAIL_FROM)
#   brevo   -> Brevo HTTPS API    (needs EMAIL_API_KEY, EMAIL_FROM)
#   console -> prints the email to the log, nothing is sent (development only)
# ============================================
email.provider=${EMAIL_PROVIDER:smtp}
email.api-key=${EMAIL_API_KEY:}
email.from=${EMAIL_FROM:}
email.from-name=${EMAIL_FROM_NAME:Mess Management System}

# SMTP settings (only used when EMAIL_PROVIDER=smtp)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8

# ============================================
# JWT
# ============================================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh-expiration=604800000
jwt.issuer=mess-management-system

# ============================================
# OTP
# ============================================
otp.expiry-minutes=5
otp.length=6

# ============================================
# LOGGING
# Quiet by default. Raise a level while debugging, e.g. LOG_LEVEL_APP=DEBUG.
# Never set LOG_LEVEL_SQL_BINDINGS=TRACE in production: it prints query values (including OTPs).
# ============================================
logging.level.org.hibernate.engine.jdbc.connections=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}
logging.level.org.springframework.boot=${LOG_LEVEL_BOOT:INFO}
logging.level.com.mess.app=${LOG_LEVEL_APP:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:INFO}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOG_LEVEL_SQL_BINDINGS:INFO}

# ============================================
# CORS (see com.mess.app.config.CorsConfig)
# FRONTEND_URL          the deployed frontend, e.g. https://platemate.vercel.app
# CORS_ALLOWED_ORIGINS  more origins, comma separated ("*" is rejected because credentials are enabled)
# CORS_ALLOW_LOCALHOST  keep http://localhost:* allowed for development (set false in production if unused)
# ============================================
cors.allowed-origins=${FRONTEND_URL:},${CORS_ALLOWED_ORIGINS:}
cors.allow-localhost=${CORS_ALLOW_LOCALHOST:true}
cors.max-age=3600

# ============================================
# CACHE
# ============================================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterAccess=300s

# ============================================
# JACKSON
# ============================================
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# ============================================
# SECURITY (JWT enforcement for /api/**, except /api/auth/**, /api/health and /uploads/**)
# ============================================
security.jwt.enforce=true

# ============================================
# PROFILE IMAGES (users, candidates, staff) - stored with the same mechanism as stock images
# ============================================
app.upload.profile-image.max-size-mb=5
